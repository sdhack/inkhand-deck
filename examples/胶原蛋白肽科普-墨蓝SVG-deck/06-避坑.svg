<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <filter id="paperGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <radialGradient id="inkHalo" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#23386B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#23386B" stop-opacity="0"/>
    </radialGradient>
    <symbol id="mozai" viewBox="0 0 900 1200" overflow="visible">
      <ellipse cx="450" cy="640" rx="220" ry="300" fill="url(#inkHalo)"/>
      <path d="M450,372 C448,328 454,298 474,286 C498,272 506,302 488,312 C476,320 480,300 466,304"
            fill="none" stroke="#34465E" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M486,300 C504,288 518,298 520,312 C506,316 492,312 486,300 Z" fill="#A3C9A8" stroke="#34465E" stroke-width="2"/>
      <path d="M482,306 C468,294 456,300 454,312 C466,316 478,314 482,306 Z" fill="#A3C9A8" stroke="#34465E" stroke-width="2"/>
      <path d="M450,372 C386,490 322,580 322,700 A128,128 0 1,0 578,700 C578,580 514,490 450,372 Z"
            fill="#23386B" stroke="#34465E" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="408" cy="600" r="13" fill="#FFFFFF"/>
      <circle cx="492" cy="600" r="13" fill="#FFFFFF"/>
      <circle cx="450" cy="680" r="12" fill="#E07B39"/>
      <path d="M420,824 L416,872" fill="none" stroke="#34465E" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M480,824 L484,872" fill="none" stroke="#34465E" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M416,872 q-8,4 -14,-2" fill="none" stroke="#34465E" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M484,872 q8,4 14,-2" fill="none" stroke="#34465E" stroke-width="3.5" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="1080" height="1920" fill="#FBFAF5"/>
  <rect width="1080" height="1920" fill="#FBFAF5" filter="url(#paperGrain)"/>

  <g stroke="#D8D6CE" stroke-width="1.2" opacity="0.6">
    <line x1="80" y1="80" x2="80" y2="160"/><line x1="80" y1="80" x2="160" y2="80"/>
    <circle cx="80" cy="80" r="3" fill="#C9C7BE" stroke="none"/>
    <line x1="900" y1="80" x2="1000" y2="80"/>
    <line x1="900" y1="74" x2="900" y2="86"/><line x1="940" y1="74" x2="940" y2="86"/><line x1="980" y1="74" x2="980" y2="86"/>
    <line x1="80" y1="1840" x2="80" y2="1760"/><line x1="80" y1="1840" x2="160" y2="1840"/>
    <circle cx="80" cy="1840" r="3" fill="#C9C7BE" stroke="none"/>
    <line x1="1000" y1="1840" x2="1000" y2="1760"/><line x1="1000" y1="1840" x2="920" y2="1840"/>
    <circle cx="1000" cy="1840" r="3" fill="#C9C7BE" stroke="none"/>
  </g>

  <text x="120" y="118" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="26" fill="#7C8794" letter-spacing="2">6 / 7</text>

  <text x="540" y="280" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="74" font-weight="600" fill="#34465E" text-anchor="middle" letter-spacing="6">别被伪科技割</text>
  <line x1="380" y1="310" x2="700" y2="310" stroke="#9DB8E0" stroke-width="4" stroke-linecap="round"/>
  <text x="540" y="370" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="32" fill="#7C8794" text-anchor="middle" letter-spacing="2">它不是神药</text>

  <!-- 墨仔左侧 -->
  <g transform="translate(220,860) scale(0.36)">
    <use href="#mozai"/>
  </g>

  <!-- 墨仔举的警示牌（指向右上的伪科技） -->
  <g transform="translate(420,1000)">
    <!-- 牌杆 -->
    <line x1="0" y1="0" x2="60" y2="-180" stroke="#34465E" stroke-width="5" stroke-linecap="round"/>
    <!-- 三角警示牌 -->
    <path d="M60,-180 L150,-280 L240,-180 Z" fill="#FBFAF5" stroke="#E07B39" stroke-width="6" stroke-linejoin="round"/>
    <!-- 警示感叹号 -->
    <line x1="150" y1="-260" x2="150" y2="-220" stroke="#E07B39" stroke-width="8" stroke-linecap="round"/>
    <circle cx="150" cy="-200" r="5" fill="#E07B39"/>
  </g>

  <!-- 右上：伪科技浮动 label -->
  <g transform="translate(740,700)">
    <ellipse cx="0" cy="0" rx="170" ry="80" fill="#FBFAF5" stroke="#34465E" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="0" y="0" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="42" fill="#34465E" text-anchor="middle" font-weight="600">石墨烯？</text>
    <text x="0" y="40" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="22" fill="#7C8794" text-anchor="middle">贴脸上就能逆龄？</text>
  </g>
  <g transform="translate(880,980)">
    <ellipse cx="0" cy="0" rx="130" ry="70" fill="#FBFAF5" stroke="#34465E" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="0" y="0" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="42" fill="#34465E" text-anchor="middle" font-weight="600">量子？</text>
    <text x="0" y="36" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="22" fill="#7C8794" text-anchor="middle">按摩 5 分钟回春？</text>
  </g>

  <!-- 中部提示：真有效的不是它 -->
  <text x="540" y="1280" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="34" fill="#34465E" text-anchor="middle" font-weight="600" letter-spacing="2">真有效的不是它</text>
  <text x="540" y="1330" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="26" fill="#7C8794" text-anchor="middle" letter-spacing="1">—— 是这些最便宜的事 ——</text>

  <!-- 底部：最划算抗老 5 件事 -->
  <g transform="translate(0,1480)">
    <!-- 5 个圆角矩形色块 -->
    <g>
      <rect x="100" y="0" width="160" height="100" rx="14" fill="#9DB8E0" opacity="0.4" stroke="#34465E" stroke-width="2.5"/>
      <text x="180" y="60" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="32" fill="#34465E" text-anchor="middle" font-weight="600">防晒</text>
    </g>
    <g>
      <rect x="280" y="0" width="160" height="100" rx="14" fill="#A3C9A8" opacity="0.5" stroke="#34465E" stroke-width="2.5"/>
      <text x="360" y="60" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="32" fill="#34465E" text-anchor="middle" font-weight="600">睡够</text>
    </g>
    <g>
      <rect x="460" y="0" width="160" height="100" rx="14" fill="#E8C3A0" opacity="0.5" stroke="#34465E" stroke-width="2.5"/>
      <text x="540" y="60" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="32" fill="#34465E" text-anchor="middle" font-weight="600">少糖</text>
    </g>
    <g>
      <rect x="640" y="0" width="160" height="100" rx="14" fill="#9DB8E0" opacity="0.4" stroke="#34465E" stroke-width="2.5"/>
      <text x="720" y="60" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="32" fill="#34465E" text-anchor="middle" font-weight="600">维 C</text>
    </g>
    <g>
      <rect x="820" y="0" width="160" height="100" rx="14" fill="#A3C9A8" opacity="0.5" stroke="#34465E" stroke-width="2.5"/>
      <text x="900" y="60" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="32" fill="#34465E" text-anchor="middle" font-weight="600">动起来</text>
    </g>
  </g>

  <text x="540" y="1700" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="28" fill="#7C8794" text-anchor="middle" letter-spacing="2">不花钱 · 效果顶配</text>
</svg>
