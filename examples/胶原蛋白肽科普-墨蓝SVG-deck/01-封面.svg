<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <filter id="paperGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <radialGradient id="inkHalo" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#23386B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#23386B" stop-opacity="0"/>
    </radialGradient>

    <!-- 墨仔符号 (可被 use 引用 + transform 缩放定位) -->
    <symbol id="mozai" viewBox="0 0 900 1200" overflow="visible">
      <!-- 墨晕 -->
      <ellipse cx="450" cy="640" rx="220" ry="300" fill="url(#inkHalo)"/>
      <!-- 顶卷须 + 绿芽 -->
      <path d="M450,372 C448,328 454,298 474,286 C498,272 506,302 488,312 C476,320 480,300 466,304"
            fill="none" stroke="#34465E" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M486,300 C504,288 518,298 520,312 C506,316 492,312 486,300 Z" fill="#A3C9A8" stroke="#34465E" stroke-width="2"/>
      <path d="M482,306 C468,294 456,300 454,312 C466,316 478,314 482,306 Z" fill="#A3C9A8" stroke="#34465E" stroke-width="2"/>
      <!-- 泪滴身体 -->
      <path d="M450,372 C386,490 322,580 322,700 A128,128 0 1,0 578,700 C578,580 514,490 450,372 Z"
            fill="#23386B" stroke="#34465E" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- 白点眼 -->
      <circle cx="408" cy="600" r="13" fill="#FFFFFF"/>
      <circle cx="492" cy="600" r="13" fill="#FFFFFF"/>
      <!-- 墨芯 -->
      <circle cx="450" cy="680" r="12" fill="#E07B39"/>
      <!-- 细腿 -->
      <path d="M420,824 L416,872" fill="none" stroke="#34465E" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M480,824 L484,872" fill="none" stroke="#34465E" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M416,872 q-8,4 -14,-2" fill="none" stroke="#34465E" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M484,872 q8,4 14,-2" fill="none" stroke="#34465E" stroke-width="3.5" stroke-linecap="round"/>
    </symbol>
  </defs>

  <!-- 暖白纸背景 + 颗粒 -->
  <rect width="1080" height="1920" fill="#FBFAF5"/>
  <rect width="1080" height="1920" fill="#FBFAF5" filter="url(#paperGrain)"/>

  <!-- 角落构造记号 -->
  <g stroke="#D8D6CE" stroke-width="1.2" opacity="0.6">
    <!-- 左上 -->
    <line x1="80" y1="80" x2="80" y2="160"/><line x1="80" y1="80" x2="160" y2="80"/>
    <circle cx="80" cy="80" r="3" fill="#C9C7BE" stroke="none"/>
    <!-- 右上标尺刻度 -->
    <line x1="900" y1="80" x2="1000" y2="80"/>
    <line x1="900" y1="74" x2="900" y2="86"/>
    <line x1="940" y1="74" x2="940" y2="86"/>
    <line x1="980" y1="74" x2="980" y2="86"/>
    <!-- 左下 -->
    <line x1="80" y1="1840" x2="80" y2="1760"/><line x1="80" y1="1840" x2="160" y2="1840"/>
    <circle cx="80" cy="1840" r="3" fill="#C9C7BE" stroke="none"/>
    <!-- 右下 -->
    <line x1="1000" y1="1840" x2="1000" y2="1760"/><line x1="1000" y1="1840" x2="920" y2="1840"/>
    <circle cx="1000" cy="1840" r="3" fill="#C9C7BE" stroke="none"/>
  </g>

  <!-- 页码 1 / 7 -->
  <text x="120" y="118" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="26" fill="#7C8794" letter-spacing="2">1 / 7</text>

  <!-- 主标题 + 下划线 + 副标题 -->
  <text x="540" y="280" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="68" font-weight="600" fill="#34465E" text-anchor="middle" letter-spacing="4">胶原蛋白肽是智商税吗？</text>
  <line x1="320" y1="310" x2="760" y2="310" stroke="#9DB8E0" stroke-width="4" stroke-linecap="round"/>
  <text x="540" y="370" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="34" fill="#7C8794" text-anchor="middle" letter-spacing="2">我翻完论文，发现两边都没全错</text>

  <!-- 中心隐喻：小天平（细墨线） -->
  <g stroke="#34465E" stroke-width="3.5" stroke-linecap="round" fill="none">
    <!-- 中央支柱 -->
    <line x1="540" y1="980" x2="540" y2="1280"/>
    <!-- 底座 -->
    <line x1="430" y1="1280" x2="650" y2="1280"/>
    <line x1="470" y1="1280" x2="610" y2="1280" stroke-width="6"/>
    <!-- 横臂 -->
    <line x1="320" y1="980" x2="760" y2="980"/>
    <!-- 吊绳 -->
    <line x1="320" y1="980" x2="370" y2="1040"/>
    <line x1="320" y1="980" x2="270" y2="1040"/>
    <line x1="760" y1="980" x2="710" y2="1040"/>
    <line x1="760" y1="980" x2="810" y2="1040"/>
  </g>
  <!-- 盘（弧形） -->
  <path d="M 270,1040 Q 320,1110 370,1040" fill="#FBFAF5" stroke="#34465E" stroke-width="3.5"/>
  <path d="M 710,1040 Q 760,1110 810,1040" fill="#FBFAF5" stroke="#34465E" stroke-width="3.5"/>
  <!-- 中央枢 -->
  <circle cx="540" cy="980" r="10" fill="#34465E"/>

  <!-- 左盘文字：劝退 ✗ -->
  <text x="320" y="1090" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="32" fill="#34465E" text-anchor="middle" font-weight="600">博士 · 劝退</text>
  <text x="320" y="1130" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="36" fill="#7C8794" text-anchor="middle">✗</text>
  <!-- 右盘文字：有效 ✓ -->
  <text x="760" y="1090" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="32" fill="#34465E" text-anchor="middle" font-weight="600">博主 · 有效</text>
  <text x="760" y="1130" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="36" fill="#7C8794" text-anchor="middle">✓</text>

  <!-- 天平上方悬浮大问号 -->
  <text x="540" y="930" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="110" font-weight="600" fill="#34465E" text-anchor="middle" opacity="0.85">？</text>

  <!-- 墨仔小比例 站在天平右侧地面 -->
  <g transform="translate(820,1180) scale(0.32)">
    <use href="#mozai"/>
  </g>
  <!-- 墨仔脚边小标签 -->
  <text x="860" y="1300" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="20" fill="#7C8794" text-anchor="middle" opacity="0.85">掂量中</text>

  <!-- 底部手写感小字 -->
  <text x="540" y="1780" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="22" fill="#7C8794" text-anchor="middle" opacity="0.85" letter-spacing="2">墨仔 · 本地矢量版 · 无水印</text>
</svg>
