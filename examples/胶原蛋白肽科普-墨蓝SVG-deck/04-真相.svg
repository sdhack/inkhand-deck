<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <filter id="paperGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <radialGradient id="inkHalo" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#23386B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#23386B" stop-opacity="0"/>
    </radialGradient>
    <symbol id="mozai" viewBox="0 0 900 1200" overflow="visible">
      <ellipse cx="450" cy="640" rx="220" ry="300" fill="url(#inkHalo)"/>
      <path d="M450,372 C448,328 454,298 474,286 C498,272 506,302 488,312 C476,320 480,300 466,304"
            fill="none" stroke="#34465E" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M486,300 C504,288 518,298 520,312 C506,316 492,312 486,300 Z" fill="#A3C9A8" stroke="#34465E" stroke-width="2"/>
      <path d="M482,306 C468,294 456,300 454,312 C466,316 478,314 482,306 Z" fill="#A3C9A8" stroke="#34465E" stroke-width="2"/>
      <path d="M450,372 C386,490 322,580 322,700 A128,128 0 1,0 578,700 C578,580 514,490 450,372 Z"
            fill="#23386B" stroke="#34465E" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="408" cy="600" r="13" fill="#FFFFFF"/>
      <circle cx="492" cy="600" r="13" fill="#FFFFFF"/>
      <circle cx="450" cy="680" r="12" fill="#E07B39"/>
      <path d="M420,824 L416,872" fill="none" stroke="#34465E" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M480,824 L484,872" fill="none" stroke="#34465E" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M416,872 q-8,4 -14,-2" fill="none" stroke="#34465E" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M484,872 q8,4 14,-2" fill="none" stroke="#34465E" stroke-width="3.5" stroke-linecap="round"/>
    </symbol>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#34465E"/>
    </marker>
  </defs>

  <rect width="1080" height="1920" fill="#FBFAF5"/>
  <rect width="1080" height="1920" fill="#FBFAF5" filter="url(#paperGrain)"/>

  <g stroke="#D8D6CE" stroke-width="1.2" opacity="0.6">
    <line x1="80" y1="80" x2="80" y2="160"/><line x1="80" y1="80" x2="160" y2="80"/>
    <circle cx="80" cy="80" r="3" fill="#C9C7BE" stroke="none"/>
    <line x1="900" y1="80" x2="1000" y2="80"/>
    <line x1="900" y1="74" x2="900" y2="86"/><line x1="940" y1="74" x2="940" y2="86"/><line x1="980" y1="74" x2="980" y2="86"/>
    <line x1="80" y1="1840" x2="80" y2="1760"/><line x1="80" y1="1840" x2="160" y2="1840"/>
    <circle cx="80" cy="1840" r="3" fill="#C9C7BE" stroke="none"/>
    <line x1="1000" y1="1840" x2="1000" y2="1760"/><line x1="1000" y1="1840" x2="920" y2="1840"/>
    <circle cx="1000" cy="1840" r="3" fill="#C9C7BE" stroke="none"/>
  </g>

  <text x="120" y="118" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="26" fill="#7C8794" letter-spacing="2">4 / 7</text>

  <text x="540" y="280" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="74" font-weight="600" fill="#34465E" text-anchor="middle" letter-spacing="6">小分子肽，真不一样</text>
  <line x1="320" y1="310" x2="760" y2="310" stroke="#9DB8E0" stroke-width="4" stroke-linecap="round"/>
  <text x="540" y="370" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="32" fill="#7C8794" text-anchor="middle" letter-spacing="2">刺激自己造胶原</text>

  <!-- 顶部：小分子肽 → 直接吸收（虚线入细胞） -->
  <g transform="translate(340,560)">
    <circle cx="0" cy="0" r="34" fill="#9DB8E0" opacity="0.4" stroke="#34465E" stroke-width="3"/>
    <circle cx="0" cy="0" r="14" fill="#FBFAF5" stroke="#34465E" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="5" fill="#34465E"/>
    <text x="0" y="80" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="28" fill="#34465E" text-anchor="middle" font-weight="600">小分子肽</text>
  </g>
  <g stroke="#34465E" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="6 6">
    <path d="M380,580 Q500,640 620,820" marker-end="url(#arrow)"/>
  </g>
  <text x="500" y="680" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="26" fill="#7C8794">直接吸收</text>

  <!-- 左侧：成纤维细胞 -->
  <g transform="translate(360,1000)">
    <!-- 细胞外形（不规则椭圆） -->
    <path d="M0,-150 C100,-150 160,-80 160,0 C160,90 100,160 0,160 C-100,160 -160,90 -160,0 C-160,-80 -100,-150 0,-150 Z"
          fill="#FBFAF5" stroke="#34465E" stroke-width="4"/>
    <!-- 内部结构：核 -->
    <circle cx="-30" cy="0" r="40" fill="none" stroke="#34465E" stroke-width="2.5" stroke-dasharray="3 3"/>
    <circle cx="-30" cy="0" r="14" fill="#34465E"/>
    <!-- 内质网/高尔基体线条 -->
    <path d="M40,-40 q40,20 20,60 q-30,30 -50,10" fill="none" stroke="#34465E" stroke-width="2" stroke-linecap="round"/>
    <text x="0" y="230" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="28" fill="#34465E" text-anchor="middle" font-weight="600">成纤维细胞</text>
  </g>

  <!-- 右侧：墨仔（喂细胞） -->
  <g transform="translate(820,1100) scale(0.30)">
    <use href="#mozai"/>
  </g>
  <!-- 墨仔小臂伸向细胞（简化为一条曲线） -->
  <path d="M730,1180 Q620,1140 540,1100" fill="none" stroke="#34465E" stroke-width="4" stroke-linecap="round"/>
  <!-- 肽滴 -->
  <circle cx="540" cy="1100" r="10" fill="#9DB8E0" stroke="#34465E" stroke-width="2.5"/>

  <!-- 下方两个产物：胶原（左） + 透明质酸（右） -->
  <!-- 胶原：螺旋 -->
  <g transform="translate(280,1480)">
    <path d="M-50,0 q25,-30 50,0 q25,30 50,0 q25,-30 50,0" fill="none" stroke="#E07B39" stroke-width="6" stroke-linecap="round"/>
    <text x="0" y="80" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="34" fill="#34465E" text-anchor="middle" font-weight="600">胶原</text>
  </g>
  <g stroke="#34465E" stroke-width="2" fill="none" stroke-dasharray="4 5" stroke-linecap="round">
    <path d="M380,900 Q360,1200 330,1440" marker-end="url(#arrow)"/>
  </g>

  <!-- 透明质酸：水滴 -->
  <g transform="translate(720,1480)">
    <path d="M0,-50 q-40,40 0,70 q40,-30 0,-70 Z" fill="#9DB8E0" opacity="0.5" stroke="#34465E" stroke-width="4"/>
    <circle cx="-10" cy="0" r="6" fill="#FFFFFF" opacity="0.8"/>
    <text x="0" y="80" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="34" fill="#34465E" text-anchor="middle" font-weight="600">透明质酸</text>
  </g>
  <g stroke="#34465E" stroke-width="2" fill="none" stroke-dasharray="4 5" stroke-linecap="round">
    <path d="M460,900 Q560,1200 690,1440" marker-end="url(#arrow)"/>
  </g>

  <text x="540" y="1700" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="28" fill="#34465E" text-anchor="middle" font-weight="600" letter-spacing="2">自己不补 · 自己造 · 才是真有效</text>
</svg>
