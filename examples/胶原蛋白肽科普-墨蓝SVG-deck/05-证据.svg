<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <filter id="paperGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <radialGradient id="inkHalo" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#23386B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#23386B" stop-opacity="0"/>
    </radialGradient>
    <symbol id="mozai" viewBox="0 0 900 1200" overflow="visible">
      <ellipse cx="450" cy="640" rx="220" ry="300" fill="url(#inkHalo)"/>
      <path d="M450,372 C448,328 454,298 474,286 C498,272 506,302 488,312 C476,320 480,300 466,304"
            fill="none" stroke="#34465E" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M486,300 C504,288 518,298 520,312 C506,316 492,312 486,300 Z" fill="#A3C9A8" stroke="#34465E" stroke-width="2"/>
      <path d="M482,306 C468,294 456,300 454,312 C466,316 478,314 482,306 Z" fill="#A3C9A8" stroke="#34465E" stroke-width="2"/>
      <path d="M450,372 C386,490 322,580 322,700 A128,128 0 1,0 578,700 C578,580 514,490 450,372 Z"
            fill="#23386B" stroke="#34465E" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="408" cy="600" r="13" fill="#FFFFFF"/>
      <circle cx="492" cy="600" r="13" fill="#FFFFFF"/>
      <circle cx="450" cy="680" r="12" fill="#E07B39"/>
      <path d="M420,824 L416,872" fill="none" stroke="#34465E" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M480,824 L484,872" fill="none" stroke="#34465E" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M416,872 q-8,4 -14,-2" fill="none" stroke="#34465E" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M484,872 q8,4 14,-2" fill="none" stroke="#34465E" stroke-width="3.5" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="1080" height="1920" fill="#FBFAF5"/>
  <rect width="1080" height="1920" fill="#FBFAF5" filter="url(#paperGrain)"/>

  <g stroke="#D8D6CE" stroke-width="1.2" opacity="0.6">
    <line x1="80" y1="80" x2="80" y2="160"/><line x1="80" y1="80" x2="160" y2="80"/>
    <circle cx="80" cy="80" r="3" fill="#C9C7BE" stroke="none"/>
    <line x1="900" y1="80" x2="1000" y2="80"/>
    <line x1="900" y1="74" x2="900" y2="86"/><line x1="940" y1="74" x2="940" y2="86"/><line x1="980" y1="74" x2="980" y2="86"/>
    <line x1="80" y1="1840" x2="80" y2="1760"/><line x1="80" y1="1840" x2="160" y2="1840"/>
    <circle cx="80" cy="1840" r="3" fill="#C9C7BE" stroke="none"/>
    <line x1="1000" y1="1840" x2="1000" y2="1760"/><line x1="1000" y1="1840" x2="920" y2="1840"/>
    <circle cx="1000" cy="1840" r="3" fill="#C9C7BE" stroke="none"/>
  </g>

  <text x="120" y="118" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="26" fill="#7C8794" letter-spacing="2">5 / 7</text>

  <text x="540" y="280" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="74" font-weight="600" fill="#34465E" text-anchor="middle" letter-spacing="6">论文站这边</text>
  <line x1="380" y1="310" x2="700" y2="310" stroke="#9DB8E0" stroke-width="4" stroke-linecap="round"/>
  <text x="540" y="370" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="32" fill="#7C8794" text-anchor="middle" letter-spacing="2">不是我瞎说</text>

  <!-- 副标：中国营养学会 2025 共识 -->
  <text x="540" y="510" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="30" fill="#7C8794" text-anchor="middle" letter-spacing="2">—— 中国营养学会 2025 共识 ——</text>

  <!-- 表格 -->
  <g transform="translate(180,580)">
    <!-- 表格外框 -->
    <rect x="0" y="0" width="720" height="640" fill="#FBFAF5" stroke="#34465E" stroke-width="3" rx="6"/>
    <!-- 行分隔线 -->
    <line x1="0" y1="120" x2="720" y2="120" stroke="#34465E" stroke-width="2"/>
    <line x1="0" y1="240" x2="720" y2="240" stroke="#34465E" stroke-width="2"/>
    <line x1="0" y1="360" x2="720" y2="360" stroke="#34465E" stroke-width="2"/>
    <line x1="0" y1="480" x2="720" y2="480" stroke="#34465E" stroke-width="2"/>
    <!-- 列分隔线 -->
    <line x1="280" y1="0" x2="280" y2="640" stroke="#34465E" stroke-width="2"/>

    <!-- 表头（pastel pale blue） -->
    <rect x="0" y="0" width="720" height="120" fill="#9DB8E0" opacity="0.25" rx="6"/>
    <text x="140" y="78" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="34" fill="#34465E" text-anchor="middle" font-weight="600">指标</text>
    <text x="500" y="78" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="34" fill="#34465E" text-anchor="middle" font-weight="600">证据</text>

    <!-- 行 1 -->
    <text x="140" y="200" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="30" fill="#34465E" text-anchor="middle">权威</text>
    <text x="500" y="200" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="30" fill="#34465E" text-anchor="middle">中国营养学会 共识</text>
    <!-- 行 2 -->
    <text x="140" y="320" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="30" fill="#34465E" text-anchor="middle">RCT 数量</text>
    <text x="500" y="320" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="30" fill="#E07B39" text-anchor="middle" font-weight="600">21 项</text>
    <!-- 行 3 -->
    <text x="140" y="440" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="30" fill="#34465E" text-anchor="middle">每日剂量</text>
    <text x="500" y="440" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="30" fill="#34465E" text-anchor="middle">2.5 – 5 g</text>
    <!-- 行 4 -->
    <text x="140" y="560" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="30" fill="#34465E" text-anchor="middle">持续周期</text>
    <text x="500" y="560" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="30" fill="#34465E" text-anchor="middle">≥ 8 周</text>
  </g>

  <!-- 底部：改善指标 -->
  <g transform="translate(540,1340)">
    <text x="0" y="0" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="36" fill="#34465E" text-anchor="middle" font-weight="600" letter-spacing="2">改善 · 皮肤弹性 · 水合 · 细纹</text>
  </g>
  <!-- 三个小图标 -->
  <g transform="translate(280,1440)">
    <circle cx="0" cy="0" r="36" fill="#A3C9A8" opacity="0.4" stroke="#34465E" stroke-width="3"/>
    <text x="0" y="80" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="24" fill="#34465E" text-anchor="middle">弹性</text>
  </g>
  <g transform="translate(540,1440)">
    <circle cx="0" cy="0" r="36" fill="#9DB8E0" opacity="0.4" stroke="#34465E" stroke-width="3"/>
    <text x="0" y="80" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="24" fill="#34465E" text-anchor="middle">水合</text>
  </g>
  <g transform="translate(800,1440)">
    <circle cx="0" cy="0" r="36" fill="#E07B39" opacity="0.3" stroke="#34465E" stroke-width="3"/>
    <text x="0" y="80" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="24" fill="#34465E" text-anchor="middle">细纹</text>
  </g>

  <!-- 墨仔坐地记笔记（左下角） -->
  <g transform="translate(140,1620) scale(0.22)">
    <use href="#mozai"/>
  </g>
  <!-- 笔记本 -->
  <g transform="translate(200,1700)">
    <rect x="0" y="0" width="180" height="120" fill="#FBFAF5" stroke="#34465E" stroke-width="3" rx="4"/>
    <line x1="0" y1="30" x2="180" y2="30" stroke="#34465E" stroke-width="1.5"/>
    <line x1="0" y1="60" x2="180" y2="60" stroke="#34465E" stroke-width="1.5"/>
    <line x1="0" y1="90" x2="180" y2="90" stroke="#34465E" stroke-width="1.5"/>
    <text x="14" y="22" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="16" fill="#34465E">RCT×21</text>
    <text x="14" y="52" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="16" fill="#34465E">2.5-5g</text>
    <text x="14" y="82" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="16" fill="#34465E">8w</text>
    <text x="14" y="112" font-family="'STKaiti','Kaiti SC','KaiTi','Microsoft YaHei',serif" font-size="16" fill="#E07B39">✓ 有证据</text>
  </g>
</svg>
